services:
  guardian:
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: guardian
    environment:
      ERDTREE_URL: ${ERDTREE_URL}
      GLADOS_URL: ${GLADOS_URL}
    expose:
      - "8000"
  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      guardian:
        condition: service_healthy
