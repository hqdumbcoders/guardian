services:
  guardian:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: guardian
    environment:
      ERDTREE_URL: ${ERDTREE_URL}
      GLADOS_URL: ${GLADOS_URL}
    expose:
      - "8000"
  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - .nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - guardian
